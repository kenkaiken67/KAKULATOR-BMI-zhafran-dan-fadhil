<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator BMI Sehat</title>
  <link rel="stylesheet" href="Untitled-2.css">
</head>
<body>

  <div class="calculator-card">
    <div class="badge">🤨 Cek Kesehatan</div>
    <h2>BMI Calculator</h2>
    <p class="subtitle">Hitung indeks massa tubuhmu dengan mudah!</p>

    <div class="input-group">
      <label for="weight">Berat Badan (kg)</label>
      <input type="number" id="weight" placeholder="Contoh: 55">
    </div>

    <div class="input-group">
      <label for="height">Tinggi Badan (cm)</label>
      <input type="number" id="height" placeholder="Contoh: 170">
    </div>

    <button class="btn-calculate">Hitung Sekarang ✨</button>
  </div>

</body>
</html>
